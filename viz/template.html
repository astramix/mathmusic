<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MathMusic Live</title>
<!--__ICON__-->
<style>/*__KATEX_CSS__*/</style>
<style>/*__CM_CSS__*/</style>
<style>/*__APP_CSS__*/</style>
<script>/*__VENDOR_JS__*/</script>
</head>
<body>
<div id="app">
  <header id="top">
    <div class="brand" title="MathMusic — музыка из функций">∿ <b>MathMusic</b></div>
    <nav id="menus"></nav>
    <div class="transport">
      <button id="play" class="tb big" title="играть / пауза (пробел)">▶</button>
      <button id="back" class="tb" title="назад на 4 такта (←)">⏪</button>
      <button id="fwd" class="tb" title="вперёд на 4 такта (→)">⏩</button>
      <button id="next" class="tb" title="следующая песня (N)">⏭</button>
      <select id="song" title="песня"></select>
      <span id="status"></span>
    </div>
    <nav id="keynav" title="тональность и лад для 🎲"></nav>
    <div class="right">
      <label class="rng" title="масштаб (колесо мыши)">🔍<input id="zoom" type="range" min="6" max="64" value="22"></label>
      <label class="rng" title="громкость">🔊<input id="vol" type="range" min="0" max="1" step="0.01" value="0.9"></label>
    </div>
  </header>
  <main id="main">
    <div id="left">
      <section id="stage">
        <canvas id="c"></canvas>
        <div id="hint"><div><b>MathMusic Live</b>выбери песню и нажми ▶ — или 🎲 «Генерация» для новой<br>наведи на линию — увидишь формулу · клик по таймлайну — перемотка</div></div>
        <div id="legend" class="panel" style="display:none"></div>
        <div id="live" class="panel" style="display:none"></div>
        <div id="insp" class="panel"></div>
        <div id="err"></div>
      </section>
      <div id="hsplit" class="splitter h" style="display:none"></div>
      <section id="bottom" style="display:none"></section>
    </div>
    <div id="vsplit" class="splitter v" style="display:none"></div>
    <aside id="side" style="display:none"></aside>
  </main>
</div>
<div id="toasts"></div>

<script type="module">
// Bootstrap: app modules (viz/app/*.js) become blob: modules; `from './x.js'` is rewritten to the
// blob of x.js, created first. MM.url(name) is also how workers and the worklet are started.
const SRC = /*__SRC__*/null
const APP = /*__APP__*/null
const blob = (s, type = 'text/javascript') => URL.createObjectURL(new Blob([s], { type }))
const urls = {}, busy = new Set()
const url = name => {
  if (urls[name]) return urls[name]
  if (!APP[name]) throw new Error(`no module ${name}`)
  if (busy.has(name)) throw new Error(`import cycle at ${name}`)
  busy.add(name)
  const src = APP[name].replace(/(\bfrom\s*|\bimport\s*)(['"])\.\/([\w.-]+\.m?js)\2/g, (_, kw, q, dep) => `${kw}'${url(dep)}'`)
  busy.delete(name)
  return (urls[name] = blob(src))
}
globalThis.MM = { SRC, APP, url, blob }
import(url('main.js')).catch(e => {
  console.error(e)
  document.getElementById('err').textContent = 'не запустилось: ' + (e?.message ?? e)
})
</script>
</body>
</html>
